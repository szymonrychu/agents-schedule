{{- if .Values.ingress.enabled -}}
{{- $fullName := include "agents-schedule.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "agents-schedule.labels" . | nindent 4 }}
  {{- if or .Values.ingress.annotations .Values.ingress.denySourceRanges }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.ingress.denySourceRanges }}
    nginx.ingress.kubernetes.io/denylist-source-range: {{ join "," . | quote }}
    {{- end }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $fullName }}-api
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
