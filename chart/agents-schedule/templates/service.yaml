apiVersion: v1
kind: Service
metadata:
  name: {{ include "agents-schedule.fullname" . }}-api
  labels:
    {{- include "agents-schedule.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "agents-schedule.componentLabels" (dict "context" . "component" "api") | nindent 4 }}
