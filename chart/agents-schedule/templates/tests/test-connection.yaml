apiVersion: v1
kind: Pod
metadata:
  name: {{ include "agents-schedule.fullname" . }}-test-connection
  labels:
    {{- include "agents-schedule.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: wget
      image: busybox:1.37.0
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      command: ['wget']
      args: ['-qO-', '-T', '10', '{{ include "agents-schedule.fullname" . }}-api:{{ .Values.service.port }}/healthz']
  restartPolicy: Never
