[project]
name = "agents-schedule"
version = "0.1.0"
description = "Cron schedules mapped to orchestrator presets, fired as agent cluster runs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agents-common @ git+https://github.com/szymonrychu/agents-common@v0.21.0",
    "croniter==6.2.4",
    "tzdata",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "psycopg[binary,pool]",
    "pydantic",
    "pydantic-settings",
]

[project.scripts]
sched = "agents_schedule.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "testcontainers[postgres]",
    "ruff",
]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_schedule"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast tests with no external service",
    "integration: needs a real service such as Postgres",
    "e2e: needs kind",
    "live: needs live external systems",
    "critical: guards user-visible flows, data integrity or security (fast lane)",
]
addopts = "-q --strict-markers -m 'not e2e'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
extend-select = ["C90", "PLR0911", "PLR0912", "PLR0915", "RET", "ERA"]

[tool.ruff.lint.mccabe]
max-complexity = 10
